<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MageDeck</title>
    <script>
      // Before first paint: the macOS window hides its title bar and overlays
      // the traffic lights on the sidebar, so the sidebar needs a top inset.
      if (/Mac/.test(navigator.platform || navigator.userAgent))
        document.documentElement.classList.add('mac');
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
