name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: tag must match the app version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Run this from a tag, not from '${{ github.ref_name }}'. Push a tag (git tag v0.1.0 && git push origin v0.1.0), or pick a tag in the Run workflow dropdown."
            exit 1
          fi
          tag='${{ github.ref_name }}'
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match tauri.conf.json version $version. Run 'npm version' to bump, or retag v$version, so the release and the bundle filenames agree."
            exit 1
          fi
          # npm version keeps these in step; a mismatch means one was hand-edited.
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          for pair in "package.json:$pkg" "Cargo.toml:$cargo"; do
            if [ "${pair#*:}" != "$version" ]; then
              echo "::error::${pair%%:*} is at ${pair#*:} but tauri.conf.json is at $version. Run 'npm version' rather than editing versions by hand."
              exit 1
            fi
          done
          echo "$tag matches package.json, tauri.conf.json and Cargo.toml at $version"

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci
      - run: npm test

  publish-tauri:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          # - platform: 'ubuntu-22.04-arm' # Only available in public repos.
          #   args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
